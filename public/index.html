<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐐 Goat Battle Royale 3D</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #8fd57c;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    #menu, #endScreen, #hud {
      position: absolute;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
    }

    #menu input, #menu select, #menu button {
      margin: 6px;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }

    #hud {
      z-index: 20;
      flex-direction: row;
      justify-content: space-between;
      padding: 10px;
      background: none;
      pointer-events: none;
    }

    #hud span {
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 10px;
    }

    #endScreen {
      display: none;
      background: rgba(0,0,0,0.9);
      color: #fff;
      font-size: 28px;
      flex-direction: column;
    }

    button:hover {
      cursor: pointer;
      background: #00b894;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="menu">
    <h1>🐐 Goat Battle Royale 3D</h1>
    <input id="pseudo" placeholder="Pseudo" />
    <select id="controls">
      <option value="zqsd">ZQSD</option>
      <option value="wasd">WASD</option>
      <option value="arrows">Flèches</option>
    </select>
    <input id="color" type="color" value="#ff9966" />
    <button id="startBtn">Jouer</button>
  </div>

  <div id="hud">
    <span id="speed">Vitesse: 0 km/h</span>
    <span id="lives">❤️ 3</span>
  </div>

  <div id="endScreen">
    <div id="endText"></div>
    <button id="backToMenu">Retour au menu</button>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
