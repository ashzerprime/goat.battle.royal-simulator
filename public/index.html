<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Goat Battle Royale 3D</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #87ceeb; /* ciel bleu */
    }
    #menu, #menu2, #endScreen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: rgba(0,0,0,0.6);
      color: white;
      z-index: 10;
    }
    #menu2 { display: none; }
    #endScreen { display: none; }
    input, select, button {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
    }
    #canvas3d {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #87ceeb;
    }
    #chat {
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: 300px;
      max-height: 300px;
      overflow-y: auto;
      background: rgba(0,0,0,0.5);
      color: white;
      padding: 5px;
      font-size: 14px;
      border-radius: 5px;
    }
    #chat input {
      width: 100%;
      box-sizing: border-box;
    }
    #speedometer {
      position: absolute;
      bottom: 10px;
      right: 10px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <!-- Menu principal -->
  <div id="menu">
    <h1>Goat Battle Royale 3D</h1>
    <input type="text" id="pseudo" placeholder="Ton pseudo">
    <input type="color" id="color" value="#ff9966">
    <select id="controls">
      <option value="wasd">WASD</option>
      <option value="arrows">Flèches</option>
    </select>
    <button id="startBtn">Jouer</button>
  </div>

  <!-- Menu lobby (menu2) -->
  <div id="menu2">
    <h2>Lobby</h2>
    <div>
      <button id="publicBtn">Public</button>
      <button id="privateBtn">Privé</button>
    </div>
    <input type="text" id="invitePseudo" placeholder="Pseudo ami">
    <button id="inviteBtn">Inviter</button>
    <div id="countdown">Démarrage dans : <span id="timer">10</span>s</div>
    <div id="lobbyPlayers"></div>
  </div>

  <!-- End screen -->
  <div id="endScreen">
    <h1 id="endText"></h1>
    <button id="backToMenu">Retour au menu</button>
  </div>

  <!-- Canvas 3D -->
  <canvas id="canvas3d"></canvas>

  <!-- Chat -->
  <div id="chat">
    <div id="chatMessages"></div>
    <input type="text" id="chatInput" placeholder="Écrire...">
  </div>

  <!-- Speedometer -->
  <div id="speedometer">0 km/h</div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="main.js"></script>
</body>
</html>
