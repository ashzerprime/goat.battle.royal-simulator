<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Goat Battle Royale - Lobby & Chat</title>
<style>
  html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#87ceeb}
  #canvas3d{position:absolute;inset:0;display:block}
  #ui { position: absolute; left: 10px; top: 10px; width: 340px; z-index: 20; }
  #menu, #lobby { background: rgba(0,0,0,0.6); color:#fff; padding:10px; border-radius:8px; margin-bottom:10px;}
  input, select, button { padding:8px; margin:4px 0; width:100%; box-sizing:border-box; }
  #lobbyPlayers { max-height:120px; overflow:auto; background: rgba(255,255,255,0.03); padding:6px; border-radius:6px; }
  #chatBox { margin-top:8px; background: rgba(0,0,0,0.6); padding:8px; border-radius:8px; }
  #lobbyChat, #gameChat { max-height:120px; overflow:auto; font-size:13px; color:#fff; padding:6px; background: rgba(0,0,0,0.1); border-radius:6px; }
  .invite-notif { background:#222; color:#fff; padding:8px; margin-top:6px; border-radius:6px; }
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>

<div id="ui">
  <div id="menu">
    <h2>Goat Battle Royale</h2>
    <input id="pseudo" placeholder="Ton pseudo (unique)">
    <input id="color" type="color" value="#ff9966">
    <select id="controls"><option value="wasd">ZQSD / WASD</option><option value="arrows">Flèches</option></select>
    <button id="createRoomBtn">Créer une salle</button>
    <input id="joinRoomId" placeholder="Saisir ID salle pour rejoindre (optionnel)">
    <button id="joinRoomBtn">Rejoindre une salle</button>
  </div>

  <div id="lobby" style="display:none;">
    <h3>Lobby <span id="roomLabel"></span></h3>
    <div id="lobbyPlayers"></div>

    <input id="inviteName" placeholder="Pseudo de l'ami à inviter">
    <button id="inviteBtn">Inviter</button>
    <div id="pendingInvites"></div>

    <div id="chatBox">
      <h4>Chat Lobby</h4>
      <div id="lobbyChat"></div>
      <input id="lobbyChatInput" placeholder="Message lobby...">
      <button id="sendLobbyChat">Envoyer</button>
    </div>

    <div id="chatBox">
      <h4>Chat en jeu</h4>
      <div id="gameChat"></div>
      <input id="gameChatInput" placeholder="Message en jeu...">
      <button id="sendGameChat">Envoyer</button>
    </div>

    <button id="startMatchBtn">Démarrer la partie (host)</button>
  </div>

  <div id="invitePrompt" style="display:none;" class="invite-notif">
    <div id="inviteText"></div>
    <button id="acceptInvite">Accepter</button>
    <button id="declineInvite">Refuser</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="main.js"></script>
</body>
</html>
