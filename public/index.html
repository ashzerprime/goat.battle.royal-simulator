<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Goat Battle Royale 3D</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; font-family: Arial; background: #87ceeb; }
  #menu, #menu2, #endScreen { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; flex-direction:column; z-index:10; color:white; }
  #menu2 { display:none; flex-direction:column; }
  button { margin:5px; padding:10px 20px; font-size:16px; cursor:pointer; }
  #canvas3d { display:block; }
  #hud { position:absolute; bottom:10px; left:10px; color:white; font-size:16px; z-index:5; }
  #chat { position:absolute; right:10px; bottom:10px; width:200px; height:200px; background:rgba(0,0,0,0.5); overflow-y:auto; padding:5px; color:white; font-size:14px; }
  #chatInput { position:absolute; right:10px; bottom:0; width:200px; }
</style>
</head>
<body>

<!-- Menu principal -->
<div id="menu">
  <h1>Goat Battle Royale</h1>
  <input type="text" id="pseudo" placeholder="Pseudo" />
  <select id="controls">
    <option value="wasd">WASD</option>
    <option value="arrows">Flèches</option>
  </select>
  <input type="color" id="color" value="#ff9966" />
  <button id="startBtn">Jouer</button>
</div>

<!-- Menu secondaire / lobby -->
<div id="menu2">
  <h2>Lobby</h2>
  <div>
    <button id="publicBtn">Public</button>
    <button id="privateBtn">Privé</button>
  </div>
  <input type="text" id="inviteInput" placeholder="Inviter un ami (pseudo)" />
  <button id="inviteBtn">Inviter</button>
  <div id="playersList"></div>
  <button id="launchBtn">Lancer la partie</button>
</div>

<!-- Canvas 3D -->
<canvas id="canvas3d"></canvas>

<!-- HUD -->
<div id="hud">
  <div>Kills: <span id="kills">0</span></div>
  <div>Top: <span id="top">0</span></div>
  <div>Vitesse: <span id="speed">0</span> km/h</div>
  <div>Stamina: <span id="stamina">100</span></div>
</div>

<!-- Chat texte -->
<div id="chat"></div>
<input id="chatInput" placeholder="Écrire..." />

<!-- Écran de fin -->
<div id="endScreen" style="display:none; flex-direction:column;">
  <h1 id="endText"></h1>
  <button id="backToMenu">Retour au menu</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
<script src="main.js"></script>

</body>
</html>
