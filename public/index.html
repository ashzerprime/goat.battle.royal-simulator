<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Goat Battle Royale</title>
  <style>
    body { margin: 0; font-family: Arial; background: #eef; }
    #menu, #endScreen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #000; }
    #canvas3d { display: block; width: 100vw; height: 100vh; background: #88c; }
    button { margin-top: 10px; padding: 5px 10px; }
  </style>
</head>
<body>
  <!-- Menu -->
  <div id="menu">
    <h2>Goat Battle Royale</h2>
    <label>Pseudo : <input type="text" id="pseudo" placeholder="Chèvre"></label><br>
    <label>Couleur : <input type="color" id="color" value="#ff9966"></label><br>
    <label>Touches : 
      <select id="controls">
        <option value="wasd">WASD</option>
        <option value="zqsd">ZQSD</option>
      </select>
    </label><br>
    <button id="startBtn">Jouer</button>
  </div>

  <!-- Écran de fin -->
  <div id="endScreen" style="display:none;">
    <h2 id="endText"></h2>
    <button id="backToMenu">Retour au menu</button>
  </div>

  <!-- Canvas 3D / rendu -->
  <canvas id="canvas3d"></canvas>

  <!-- Socket.IO client -->
  <script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>

  <!-- Ton main.js -->
  <script src="main.js"></script>
</body>
</html>
