<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Goat Battle Royale 🐐</title>
<style>
  body, html { margin:0; padding:0; overflow:hidden; font-family:Arial; background:#87ceeb; }
  #menu, #endScreen { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background:rgba(0,0,0,0.7); color:white; z-index:10; }
  #menu input, #menu select, #menu button { margin:5px; padding:8px; font-size:16px; }
  #canvas3d { display:block; }
  #stats { position:absolute; top:10px; left:10px; font-size:16px; color:white; }
  #speed { position:absolute; bottom:10px; right:10px; font-size:16px; color:white; }
</style>
</head>
<body>

<div id="menu">
  <h1>Goat Battle Royale 🐐</h1>
  <input type="text" id="pseudo" placeholder="Pseudo">
  <select id="controls">
    <option value="wasd">WASD</option>
    <option value="arrows">Flèches</option>
  </select>
  <input type="color" id="color" value="#ff9966">
  <button id="startBtn">Jouer</button>
  <button id="inviteBtn">Inviter un ami</button>
</div>

<div id="endScreen" style="display:none;">
  <h1 id="endText">GAME OVER</h1>
  <button id="backToMenu">Retour au menu</button>
</div>

<div id="stats">Kills: 0 | Top1: 0</div>
<div id="speed">0 km/h</div>

<canvas id="canvas3d"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="main.js"></script>
</body>
</html>
