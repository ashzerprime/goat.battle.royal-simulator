<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goat Battle Royale</title>
<style>
  body { margin:0; font-family:Arial, sans-serif; overflow:hidden; background:#ccc; }
  #menu,#menu2,#endScreen { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; flex-direction:column; }
  #menu2 { display:none; }
  input, select, button { margin:5px; padding:5px; }
  #canvas3d { display:block; background:#88c; width:800px; height:600px; margin:auto; }
  #speed { position:absolute; bottom:10px; right:10px; color:white; font-size:18px; font-weight:bold; }
  #chat { position:absolute; bottom:50px; left:10px; width:300px; max-height:200px; background:rgba(0,0,0,0.5); color:white; overflow-y:auto; padding:5px; }
  #chatInput { position:absolute; bottom:10px; left:10px; width:240px; }
</style>
</head>
<body>

<!-- Menu principal -->
<div id="menu">
  <h1>Goat Battle Royale</h1>
  <input type="text" id="pseudo" placeholder="Pseudo">
  <select id="controls">
    <option value="wasd">ZQSD</option>
    <option value="arrows">Flèches</option>
  </select>
  <input type="color" id="color" value="#ff9966">
  <button id="startBtn">Jouer</button>
</div>

<!-- Menu 2 -->
<div id="menu2">
  <h2>Lobby</h2>
  <div>
    <button id="pubBtn">Publique</button>
    <button id="privBtn">Privée</button>
  </div>
  <div>
    <input type="text" id="invitePseudo" placeholder="Pseudo ami">
    <button id="inviteBtn">Inviter</button>
  </div>
  <div>
    <button id="launchBtn">Lancer la partie</button>
  </div>
  <div>
    <label>IA: <input type="number" id="iaCount" value="3" min="0" max="16"></label>
  </div>
  <div>
    <label>Son: <input type="checkbox" id="soundToggle" checked></label>
  </div>
  <button id="backLobby">Retour menu</button>
</div>

<canvas id="canvas3d" width="800" height="600"></canvas>
<div id="speed">Vitesse: 0 km/h</div>
<div id="chat"></div>
<input type="text" id="chatInput" placeholder="Écrire...">

<script src="/socket.io/socket.io.js"></script>
<script src="main.js"></script>
</body>
</html>
