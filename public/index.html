<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Goat Battle Royale 3D</title>
<style>
  body { margin:0; overflow:hidden; font-family:Arial,sans-serif; background:#88ccee; }
  #menu, #endScreen {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    background:rgba(0,0,0,0.7); color:#fff; z-index:10;
  }
  #menu input, #menu select, #menu button {
    margin:5px; padding:5px 10px; font-size:16px;
  }
  #canvas3d { display:block; width:100%; height:100%; }
</style>
</head>
<body>

<!-- Menu -->
<div id="menu">
  <h1>Goat Battle Royale 3D</h1>
  <input id="pseudo" placeholder="Pseudo">
  <input id="color" type="color" value="#ff9966">
  <select id="controls">
    <option value="wasd">WASD</option>
    <option value="zqsd">ZQSD</option>
  </select>
  <button id="startBtn">Jouer</button>
</div>

<!-- Écran fin -->
<div id="endScreen" style="display:none;">
  <h2 id="endText"></h2>
  <button id="backToMenu">Retour au menu</button>
</div>

<!-- Canvas Three.js -->
<canvas id="canvas3d"></canvas>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<!-- Socket.IO -->
<script src="/socket.io/socket.io.js"></script>
<!-- Ton main.js -->
<script src="main.js"></script>

</body>
</html>
