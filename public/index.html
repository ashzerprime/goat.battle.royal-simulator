<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Goat Battle Royale 3D</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #87CEEB;
    }
    #menu, #menu2, #endScreen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      z-index: 100;
    }
    #menu2 { display: none; }
    #endScreen { display: none; }
    input, select, button { margin: 5px; padding: 8px; font-size: 14px; }
    #chat {
      position: absolute;
      bottom: 10px; left: 10px;
      width: 250px;
      max-height: 200px;
      background: rgba(0,0,0,0.5);
      color: white;
      overflow-y: auto;
      font-size: 12px;
      padding: 5px;
      z-index: 50;
    }
    #chatInput {
      width: 250px;
      position: absolute;
      bottom: 0; left: 10px;
      z-index: 50;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="menu">
    <h1>Goat Battle Royale 3D</h1>
    <input id="pseudo" placeholder="Pseudo">
    <input id="color" type="color" value="#ff9966">
    <select id="controls">
      <option value="wasd">ZQSD / WASD</option>
      <option value="arrows">Flèches</option>
    </select>
    <button id="startBtn">Jouer</button>
  </div>

  <div id="menu2">
    <h2>Lobby</h2>
    <p id="roomInfo">Salle : ...</p>
    <input id="inviteInput" placeholder="Pseudo à inviter">
    <button id="inviteBtn">Inviter</button>
    <button id="startGameBtn">Démarrer la partie</button>
    <div id="settings">
      <label>Mode: 
        <select id="gameMode">
          <option value="public">Public</option>
          <option value="private">Privé</option>
        </select>
      </label>
      <label>IA : <input type="number" id="aiCount" min="0" max="20" value="5"></label>
    </div>
  </div>

  <div id="endScreen">
    <h1 id="endText">GAME OVER</h1>
    <button id="backToMenu">Retour au menu</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="chat"></div>
  <input id="chatInput" placeholder="Taper un message" type="text">

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
