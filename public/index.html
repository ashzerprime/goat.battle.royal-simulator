<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Goat Battle Royale 3D</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #menu, #menu2, #endScreen { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      display: flex; flex-direction: column; justify-content: center; align-items: center; 
      background: rgba(0,0,0,0.8); color: white; z-index: 100; 
    }
    #menu2 { display: none; }
    #endScreen { display: none; }
    input, select, button { margin: 5px; padding: 8px; font-size: 14px; }
    #chat { position: absolute; bottom: 10px; left: 10px; width: 300px; max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.5); padding: 5px; color: white; }
    #chatInput { width: 200px; }
    #speed { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.5); padding: 5px; color: white; font-size: 16px; }
  </style>
</head>
<body>
  <div id="menu">
    <h1>Goat Battle Royale</h1>
    <input id="pseudo" placeholder="Pseudo">
    <select id="controls">
      <option value="wasd">WASD</option>
      <option value="zqsd">ZQSD</option>
      <option value="arrows">Flèches</option>
    </select>
    <input type="color" id="color" value="#ff9966">
    <button id="startBtn">Jouer</button>
  </div>

  <div id="menu2">
    <h2>Lobby</h2>
    <div>
      <label>Mode: </label>
      <select id="modeSelect">
        <option value="public">Public</option>
        <option value="private">Privé</option>
      </select>
    </div>
    <div>
      <label>Inviter un ami (pseudo): </label>
      <input id="inviteInput" placeholder="Pseudo ami">
      <button id="inviteBtn">Inviter</button>
    </div>
    <button id="startGameBtn">Lancer la partie</button>
    <div id="lobbyPlayers"></div>
  </div>

  <div id="endScreen">
    <h1 id="endText"></h1>
    <button id="backToMenu">Retour au menu</button>
  </div>

  <div id="chat"></div>
  <input type="text" id="chatInput" placeholder="Écrire..." />

  <div id="speed">0 km/h</div>
  <canvas id="gameCanvas"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
