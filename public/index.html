<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Goat Battle Royale 3D</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,Arial;}
    #canvas3d{position:fixed;inset:0;display:block;}
    /* UI */
    .overlay{position:fixed;z-index:20;left:12px;top:12px;width:340px}
    #menu,#lobby,#endScreen{background:rgba(0,0,0,0.6);color:#fff;padding:12px;border-radius:8px}
    input,select,button{width:100%;padding:8px;margin:6px 0;border-radius:6px;border:0;font-size:15px}
    button{background:#ffd166;color:#000;font-weight:700;cursor:pointer}
    #chat{position:fixed;right:12px;bottom:12px;width:320px;background:rgba(0,0,0,0.5);padding:8px;border-radius:8px;color:#fff;z-index:20}
    #chatLog{height:180px;overflow:auto;font-size:13px;margin-bottom:8px}
    #speedHUD{position:fixed;right:12px;top:12px;background:rgba(0,0,0,0.4);padding:8px;border-radius:6px;color:#fff;z-index:19}
    #playersList{max-height:140px;overflow:auto;background:rgba(255,255,255,0.02);padding:6px;border-radius:6px;margin-bottom:8px}
    #inviteBox{display:flex;gap:6px}
    #inviteBox input{flex:1;width:auto}
  </style>
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <div class="overlay" id="menu">
    <h2>🐐 Goat Battle Royale</h2>
    <input id="pseudo" placeholder="Ton pseudo (unique)" />
    <input id="color" type="color" value="#ff9966" />
    <select id="controls">
      <option value="zqsd">ZQSD</option>
      <option value="wasd">WASD</option>
      <option value="arrows">Flèches</option>
    </select>
    <select id="mode">
      <option value="public">Public</option>
      <option value="private">Privé</option>
    </select>
    <button id="createRoomBtn">Créer une salle</button>
    <input id="joinRoomId" placeholder="Entrer ID pour rejoindre (optionnel)"/>
    <button id="joinRoomBtn">Rejoindre une salle</button>
  </div>

  <div class="overlay" id="lobby" style="left:12px;top:12px;display:none">
    <h3>Lobby <span id="roomLabel"></span></h3>
    <div id="playersList"></div>

    <div id="inviteBox">
      <input id="inviteName" placeholder="Pseudo ami à inviter" />
      <button id="inviteBtn" style="width:120px">Inviter</button>
    </div>

    <div style="margin-top:8px">
      <button id="startGameBtn">Lancer la partie (host)</button>
      <button id="leaveBtn" style="background:#ef476f;color:#fff">Quitter</button>
    </div>
  </div>

  <div id="chat">
    <div id="chatLog"></div>
    <input id="chatInput" placeholder="Écrire..." />
  </div>

  <div id="speedHUD">0 km/h</div>

  <div id="endScreen" style="display:none;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:30;">
    <div style="background:rgba(0,0,0,0.8);padding:20px;border-radius:8px">
      <h2 id="endTitle">GAME OVER</h2>
      <button id="backToMenu">Retour au menu</button>
    </div>
  </div>

  <!-- libs (socket.io client served by server) and three.js from CDN -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
