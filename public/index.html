<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Goat Battle Royale 3D </title>
<style>
  body, html { margin:0; padding:0; overflow:hidden; font-family:sans-serif; }
  #menu, #menu2, #endScreen { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; flex-direction:column; justify-content:center; align-items:center; color:#fff; z-index:10; }
  #menu2 { display:none; }
  #endScreen { display:none; }
  input, select, button { margin:5px; padding:8px; font-size:16px; }
  #speed { position:absolute; bottom:10px; right:10px; color:#fff; font-size:18px; background:rgba(0,0,0,0.5); padding:5px 10px; border-radius:5px; }
  canvas { display:block; background:#88cc88; }
</style>
</head>
<body>
  <!-- Menu principal -->
  <div id="menu">
    <h1>Goat Battle Royale </h1>
    <input type="text" id="pseudo" placeholder="Pseudo">
    <input type="color" id="color" value="#ff9966">
    <select id="controls">
      <option value="wasd">WASD</option>
      <option value="zqsd">ZQSD</option>
      <option value="arrows">Flèches</option>
    </select>
    <button id="startBtn">Jouer</button>
  </div>

  <!-- Menu 2 -->
  <div id="menu2">
    <h2>Paramètres de la partie</h2>
    <button id="publicBtn">Publique</button>
    <button id="privateBtn">Privée</button>
    <input type="text" id="inviteInput" placeholder="Pseudo ami">
    <button id="inviteBtn">Inviter</button>
    <div id="countdown">Temps restant: <span id="countNum">5</span></div>
  </div>

  <!-- Écran de fin -->
  <div id="endScreen">
    <h1 id="endText"></h1>
    <button id="backToMenu">Retour au menu</button>
  </div>

  <canvas id="canvas3d" width="800" height="600"></canvas>
  <div id="speed">Vitesse: 0 km/h</div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="main.js"></script>
</body>
</html>
