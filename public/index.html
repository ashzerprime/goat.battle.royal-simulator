<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐐 Goat Battle Royale</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #88cc88, #ccffcc);
      overflow: hidden;
      font-family: 'Comic Sans MS', sans-serif;
      color: #222;
    }

    #menu {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      z-index: 10;
    }

    #menu input, #menu select, #menu button {
      margin: 8px;
      padding: 10px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    #startBtn, #inviteBtn {
      background: #4caf50;
      color: white;
      cursor: pointer;
    }

    #inviteBtn {
      background: #2196f3;
    }

    #livesDisplay {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 20px;
      background: rgba(255,255,255,0.7);
      padding: 6px 12px;
      border-radius: 8px;
    }

    #endScreen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.8);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      z-index: 20;
      display: none;
    }

    #backToMenu {
      margin-top: 20px;
      background: #ff9800;
      color: white;
      padding: 10px 20px;
      font-size: 20px;
      border-radius: 10px;
      cursor: pointer;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="menu">
    <h1>🐐 Goat Battle Royale</h1>
    <input id="pseudo" placeholder="Ton pseudo" />
    <input id="color" type="color" value="#ff9966" />
    <select id="controls">
      <option value="wasd">Contrôles WASD</option>
      <option value="zqsd">Contrôles ZQSD</option>
    </select>
    <button id="startBtn">JOUER</button>
    <button id="inviteBtn">INVITER UN AMI</button>
  </div>

  <div id="livesDisplay">❤️ Vies: <span id="lives">3</span></div>

  <canvas id="canvas3d" width="800" height="600"></canvas>

  <div id="endScreen">
    <div id="endText"></div>
    <button id="backToMenu">Retour au menu</button>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
